[project]
name = "cdl-mcp"
version = "0.1.0"
description = "MCP server exposing Call of Duty League match data via breakingpoint.gg"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
cdl-mcp = "cdl_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdl_mcp"]
